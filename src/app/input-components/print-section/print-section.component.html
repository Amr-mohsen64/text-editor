<ds-button customAction size="small" (click)="downloadPrintBE('preview')" [ngClass]="{'is--loading': previewingFile}"
  [matTooltip]="i18n.translate('preview')" icon square>
  <ds-icon class="spin fc-purple" icon="spinner"></ds-icon>
  <span class="fs-12 fw-medium fc-dark-gray">
    {{ i18n.translate('prepareFile') }}
  </span>
  <ds-icon icon="eye"></ds-icon>
</ds-button>

<ds-button customAction size="small" (click)="downloadPrintBE('save')" [matTooltip]="i18n.translate('downloadPrint')"
  icon square [ngClass]="{'is--loading': downloadingPrintFile}">
  <ds-icon class="spin fc-purple" icon="spinner"></ds-icon>
  <span class="fs-12 fw-medium fc-dark-gray">
    {{ i18n.translate('prepareFile') }}
  </span>
  <ds-icon icon="download"></ds-icon>
</ds-button>

<ds-button customAction size="small" [matTooltip]="i18n.translate('generateEmail')" 
(click)="generateEmail()" icon
  square [ngClass]="{'is--loading': downloadingFiles}">
  <ds-icon class="spin fc-purple" icon="spinner"></ds-icon>
  <span class="fs-12 fw-medium fc-dark-gray">
    {{ i18n.translate('prepareFile') }}
  </span>
  <ds-icon icon="mail-o"></ds-icon>
</ds-button>
