<div class="popup-container">
  <div class="d-flex align-items-center justify-content-between" mat-dialog-title>
    <h3 class="mb-0 font-16 fw-medium">{{i18n.translate('sendReminder')}}</h3>
    <ds-button matDialogClose icon>
      <ds-icon icon="close" class="fs-20 fc-black"></ds-icon>
    </ds-button>
  </div>
  <mat-dialog-content>


    <editor id="editor" [(ngModel)]="StateMachineService.dataModel" class="full" [init]="init"></editor>

    <!-- <h2 class="fs-16 fw-medium fc-black mb-3 mt-3">
      {{i18n.translate('AreYouSureYouWantSendReminder')}}
    </h2> -->
  </mat-dialog-content>
  <mat-dialog-actions class="default-footer justify-content-end gap-3">
    <ds-button shape="outline" (click)="cancel()" color="red">
      {{i18n.translate('cancel')}}
    </ds-button>
    <ds-button (click)="confirm()" [ngClass]="{'disabled':isEmpty}">
      {{i18n.translate('send')}}
    </ds-button>
  </mat-dialog-actions>
</div>
